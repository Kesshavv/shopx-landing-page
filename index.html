<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopX - Ecommerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 class="logo">ShopX</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h2>New Collection 2026</h2>
    <p>Discover amazing products with best prices</p>
    <button>Shop Now</button>
  </div>

  <!-- Working Image -->
  <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="product">
</section>

<section class="products">
  <h2>Trending Products</h2>

  <div class="product-container">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
      <h3>Sneakers</h3>
      <p>$49</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=400">
      <h3>Watch</h3>
      <p>$99</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1591561954557-26941169b49e?w=400">
      <h3>Headphones</h3>
      <p>$79</p>
    </div>

  </div>
</section>

<!-- GitHub Floating Button -->
<a href="https://github.com/Kesshavv" target="_blank" class="github-float">
  <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
</a>

<script src="script.js"></script>
</body>
</html>
